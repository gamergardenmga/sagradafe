    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif-sacred { font-family: 'Playfair Display', serif; }

        /* PLANO DE FUNDO DE VÍDEO REALISTA (Nuvens e Raios de Sol) */
        .video-fundo-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            overflow: hidden;
            pointer-events: none;
        }

        .video-fundo-container video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* Camada translúcida escura por cima do vídeo para destacar os textos brancos e dourados */
        .overlay-divino {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, rgba(15, 14, 19, 0.75) 0%, rgba(20, 18, 30, 0.6) 50%, rgba(15, 14, 19, 0.85) 100%);
            z-index: -2;
            pointer-events: none;
        }

        /* Brilho Dourado Sagrado no Hover dos Cards */
        .sacred-glow:hover {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            border-color: rgba(212, 175, 55, 0.8);
            transform: translateY(-3px);
            transition: all 0.4s ease;
        }

        /* Animação da Barra de Carregamento */
        @keyframes loadBar {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .animate-load {
            animation: loadBar 2s ease-in-out forwards;
        }
    </style>
</head>
